name: mealix
description: "Household management app for meal planning, grocery shopping, and recipe management"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cache: 
    path: ./packages/cache
  cupertino_icons: ^1.0.8
  equatable: ^2.0.0
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  go_router: ^15.1.1
  google_sign_in: ^6.1.0
  hooks_riverpod: ^2.6.1
  intl: any
  meta: ^1.8.0
  riverpod_annotation: ^2.6.1


dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  firebase_auth_platform_interface: ^7.0.5
  firebase_core_platform_interface: ^5.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  mocktail: ^1.0.0
  plugin_platform_interface: ^2.1.7
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/


flutter_native_splash:
  android: true
  ios: true
  background_image: assets/images/splash.png
  branding_bottom_padding: 0